# FilmCraft Lite for Windows x64: builds the .msi installer and the portable .zip with
# packaging/windows/package.ps1 (unsigned: no signing certificate in this repository).
#
# Push a tag `lite-v<anything>` (e.g. `git tag lite-v1 && git push origin lite-v1`) to publish a
# GitHub Release with both files; "Run workflow" on the Actions tab only builds them and keeps
# them as a workflow artifact.
name: FilmCraft Lite (Windows)

on:
  push:
    tags: ["lite-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lite-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DIST: ${{ github.workspace }}\dist\release
      # Japanese text in the UI and titles, as the official release builds have it.
      CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
    steps:
      - uses: actions/checkout@v4

      - name: craft-fonts
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/storytold/craft-fonts $env:CRAFT_FONTS_DIR
          git -C $env:CRAFT_FONTS_DIR checkout abb83316d96aa59c1cf64784289e378fe9fa5695

      - name: Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-pc-windows-msvc

      - name: WiX
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          "FILMCRAFT_VERSION=$v-lite.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Build and package
        shell: pwsh
        run: pwsh packaging/windows/package.ps1 -Arch x64

      - uses: actions/upload-artifact@v4
        with:
          name: filmcraft-lite-windows-x64
          path: dist/release/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/lite-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          FilmCraft Lite $env:FILMCRAFT_VERSION for Windows (64-bit Intel/AMD).

          **Install:** download ``filmcraft-$env:FILMCRAFT_VERSION-windows-x64.msi`` and double-click it.
          No install rights? Use the portable ``.zip``: unzip it and run ``filmcraft.exe``.

          **"Windows protected your PC":** this build is not code-signed. Click **More info**, then **Run anyway**.

          Lite mode turns on by itself on PCs with 8 GB of RAM or less and no dedicated graphics card; see docs/lite-mode.md.
          "@
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/release/*).FullName --title "FilmCraft Lite ${{ github.ref_name }}" --notes $notes
